# IR-YOLOv8n -- P2 small-target detection layer + ECA + GSConv neck
# Outputs P2(4x), P3(8x), P4(16x) -- drops P5(32x), adds P2 for small targets
# Requires: models/custom_modules.py (auto-registers ECA, GSConv, C2f_GS)

nc: 1  # infrared small target (single class)
scales:
  n: [0.33, 0.25, 1024]

backbone:
  - [-1, 1, Conv, [64, 3, 2]]    # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]]   # 1-P2/4
  - [-1, 3, C2f, [128, True]]
  - [-1, 1, ECA, [128]]          # 3 -- lightweight attention after P2
  - [-1, 1, Conv, [256, 3, 2]]   # 4-P3/8
  - [-1, 6, C2f, [256, True]]
  - [-1, 1, ECA, [256]]          # 6 -- attention after P3
  - [-1, 1, Conv, [512, 3, 2]]   # 7-P4/16
  - [-1, 6, C2f, [512, True]]
  - [-1, 1, Conv, [1024, 3, 2]]  # 9-P5/32
  - [-1, 3, C2f, [1024, True]]
  - [-1, 1, SPPF, [1024, 5]]     # 11

head:
  # ---------- P2/4 path (new: high-res small-target detection) ----------
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]         # 12
  - [[-1, 8], 1, Concat, [1]]                          # 13 P4 + up
  - [-1, 1, C2f_GS, [512]]                             # 14 -- lightweight C2f_GS

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]         # 15
  - [[-1, 5], 1, Concat, [1]]                          # 16 P3 + up
  - [-1, 1, C2f_GS, [256]]                             # 17 -- lightweight C2f_GS

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]         # 18
  - [[-1, 2], 1, Concat, [1]]                          # 19 P2 + up
  - [-1, 1, C2f_GS, [128]]                             # 20 (P2/4-small)

  # ---------- Bottom-up path ----------
  - [-1, 1, GSConv, [128, 3, 2]]                       # 21
  - [[-1, 17], 1, Concat, [1]]                         # 22
  - [-1, 1, C2f_GS, [256]]                             # 23 (P3/8-medium)

  - [-1, 1, GSConv, [256, 3, 2]]                       # 24
  - [[-1, 14], 1, Concat, [1]]                         # 25
  - [-1, 1, C2f_GS, [512]]                             # 26 (P4/16-large)

  - [[20, 23, 26], 1, Detect, [nc]]                    # Detect(P2, P3, P4)
