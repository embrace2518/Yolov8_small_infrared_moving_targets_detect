io:
  input_root: D:/Dataset/train/2
  output_root: D:/Dataset_preprocessed/train
  image_exts: [.png, .jpg, .jpeg, .bmp, .tif, .tiff]

nuc:
  alpha: 0.02

denoise:
  method: gaussian   # gaussian | median | nlm
  kernel: 3
  h: 10              # used by nlm

clahe:
  clip_limit: 2.5
  tile_grid_size: [8, 8]
  gamma: 0.95

gmm:
  history: 120
  var_threshold: 16
  detect_shadows: false
  learning_rate: -1.0

proposal:
  min_area: 4
  max_area: 1600
  max_proposals_per_frame: 10
  binary_threshold: 200
  morph_kernel: 3

output:
  save_masks: true
  save_overlays: true
  save_metadata: false

synthetic:
  enable: false
  copies_per_frame: 1
  blend_alpha: 0.7
  max_shift: 12

