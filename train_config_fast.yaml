# Fast profile for RTX 3060 + infrared small targets
# Use: python train.py --config train_config_fast.yaml

# Dataset
train_data_dir:
  - "D:/Dataset/train/1"
  - "D:/Dataset/train/2"
  - "D:/Dataset/train/4"
  - "D:/Dataset/train/5"
  - "D:/Dataset/train/6"
  - "D:/Dataset/train/7"
  - "D:/Dataset/train/8"
  - "D:/Dataset/train/9"
  - "D:/Dataset/train/10"
val_data_dir:
  - "D:/Dataset/train/11"
output_dir: "runs/detect"
pre_config_path: "dataset/preprocess_config.yaml"

# Model
base_model: "models/yolov8.yaml"
pretrained: false
pretrained_weights: "models/yolov8.pt"
class_names: ["target"]
num_classes: 1
input_channels: 1
replicate_gray_to_3ch_for_yolo_aug: true

# Train (speed-first)
epochs: 60
batch_size: 10
imgsz: 640
device: "cuda"
optimizer: "AdamW"
learning_rate: 0.001
weight_decay: 0.0005
warmup_epochs: 2.0
workers: 0
cache: false
use_amp: true
half: false
multi_scale: false

# Augment (YOLO-side)
augment: true
mosaic: 0.05
mixup: 0.0
hsv_h: 0.0
hsv_s: 0.0
hsv_v: 0.0

# Control
seed: 42
patience: 20
save_period: 10
run_name: "fast_rtx3060_ir"
refresh_staging: true

# Model artifact sync
models_dir: "models"
best_compare_metric: "metrics/box_map50_95"

