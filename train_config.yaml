# Recommended config for RTX 3060 + infrared small targets
# This file maps 1:1 to trainer.TrainingConfig fields.

# Dataset
train_data_dir:
  - "D:/Dataset/train/1"
  - "D:/Dataset/train/2"
  - "D:/Dataset/train/4"
  - "D:/Dataset/train/5"
  - "D:/Dataset/train/6"
  - "D:/Dataset/train/7"
  - "D:/Dataset/train/8"
  - "D:/Dataset/train/9"
  - "D:/Dataset/train/10"
val_data_dir:
  - "D:/Dataset/train/11"
  - "D:/Dataset/train/12"
  - "D:/Dataset/train/13"
output_dir: "runs/detect"
dataset_config_path: "dataset/dataset_config.yaml"

# Model
base_model: "models/ir_yolov8n.yaml"  # 模型结构 YAML，文件名含 ir_ 则自动启用 ECA+GSConv+P2
wiou_loss: true                 # true → 回归损失用 WIoU
use_nwd: true                   # true → 标签分配混入 NWD（小目标匹配更友好）
use_preprocess: true           # true → 训练时开启 NUC+去噪+CLAHE+Gamma
pretrained: true
pretrained_weights: "runs/detect/exp_20260504_182517/weights/best.pt"
class_names: ["target"]
num_classes: 1
input_channels: 3  # 3 → [frame_t, |t - t-1|, |t - t-2|] 帧间差分；1 → 单帧灰度

# Train
epochs: 120
batch_size: 16
imgsz: 640
device: "cuda"
optimizer: "AdamW"
learning_rate: 0.001
weight_decay: 0.0005
warmup_epochs: 3.0
workers: 4
cache: true
use_amp: true
half: false
multi_scale: false

# Augment (YOLO-side)
augment: true
mosaic: 0.1
mixup: 0.0
hsv_h: 0.0
hsv_s: 0.0
hsv_v: 0.0
copy_paste: 0.3

# Control
seed: 42
patience: 20
save_period: 5
run_name: null
clip_grad: 1.0

enable_preprocess_eval: false

