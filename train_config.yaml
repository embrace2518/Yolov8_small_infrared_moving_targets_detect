# Recommended config for RTX 3060 + infrared small targets
# This file maps 1:1 to trainer.TrainingConfig fields.

# Dataset
train_data_dir:
  - "D:/Dataset/train/1"
  - "D:/Dataset/train/2"
  - "D:/Dataset/train/4"
  - "D:/Dataset/train/5"
  - "D:/Dataset/train/6"
  - "D:/Dataset/train/7"
  - "D:/Dataset/train/8"
  - "D:/Dataset/train/9"
  - "D:/Dataset/train/10"
val_data_dir:
  - "D:/Dataset/train/11"
  - "D:/Dataset/train/12"
  - "D:/Dataset/train/13"
output_dir: "runs/detect"
dataset_config_path: "dataset/dataset_config.yaml"

# Model
base_model: "models/yolov8.yaml"
# IR-YOLOv8n 改进配置
use_ir_model: true             # true → 使用 ir_yolov8n.yaml（P2 + ECA + GSConv）
model_yaml: "models/ir_yolov8n.yaml"  # IR 模型结构 YAML 路径
wiou_loss: true                 # true → 回归损失用 WIoU（NWD 标签分配始终保留）
# 两阶段训练（先训标准YOLOv8n基线，再微调IR-YOLOv8n）
two_stage: false                # true → 自动两阶段训练（需要 use_ir_model: true）
stage1_epochs: 60               # 阶段1：基线训练epoch数

pretrained: true
pretrained_weights: "runs/detect/exp_20260429_094305/weights/best.pt"
class_names: ["target"]
num_classes: 1
input_channels: 3

# Train
epochs: 120
batch_size: 16
imgsz: 640
device: "cuda"
optimizer: "AdamW"
learning_rate: 0.001
weight_decay: 0.0005
warmup_epochs: 3.0
workers: 4
cache: true
use_amp: true
half: false
multi_scale: false

# Augment (YOLO-side)
augment: true
mosaic: 0.1
mixup: 0.0
hsv_h: 0.0
hsv_s: 0.0
hsv_v: 0.0
copy_paste: 0.3

# Control
seed: 42
patience: 10
save_period: 10
run_name: null
clip_grad: 1.0

# 预处理对比评估
# 开启后，训练结束时会对验证集分别评估 无预处理 / 有预处理 的图像，输出对比结果。
# 注意：实际的预处理是否在训练中使用，取决于 dataset_config.yaml 的 enable_preprocess。
#       这个开关只是用来做对比实验，验证预处理的效果。
enable_preprocess_eval: false

